
{% extends 'base.html' %}

{% block title %}Cadastro{% endblock %}

{% block content %}
<section class="cad">
    <div class="formCad">
        <div class="logo-login">💧🔥</div>

        <h1>Faça o seu cadastro!</h1>
        <p class="subtitulo-cad">
            Crie sua conta para fazer seus pedidos.
        </p>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <input
                type="submit"
                name="cadEnviar"
                class="cadEnviar"
                value="Cadastrar"
            >
        </form>


    </div>
</section>
{% endblock %}
